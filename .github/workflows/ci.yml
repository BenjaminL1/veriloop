# .github/workflows/ci.yml
name: ci
on: [push, pull_request]          # NEVER pull_request_target
permissions:
  contents: read                  # minimum; no write scopes
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]        # matches package.json engines ">=18"
    steps:
      # Pin refresh: git ls-remote https://github.com/actions/<action> refs/tags/v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262    # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ matrix.node }}
      # No install step and no cache on purpose: veriloop is deliberately
      # dependency-free and ships no lockfile, so `npm ci` would fail.
      # If a dependency is ever added, add `npm ci` here — and a lockfile.
      - run: npm run lint
      - run: npm run test
